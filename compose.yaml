services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: finsight
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - finsight_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finsight']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  finsight_pg:
